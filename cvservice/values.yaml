namespace: epiplexai

# Global Image Pull Secret for ACR (Optional)
global:
  imagePullSecrets: acr-secret

# Service Account Configuration
serviceAccount:
  create: false
  name: "epiplexai-service-account"

# Number of replicas per service
replicaCount: 0

# Resource Limits and Requests
resources:
  limits:
    cpu: "500"
    memory: "512Mi"
  requests:
    cpu: "1"
    memory: "1Gi"

# Type of Kubernetes Service
service:
  type: ClusterIP

# Horizontal Pod Autoscaler (HPA)
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Ingress (not used, you're using Istio)
ingress:
  enabled: false
  annotations: {}
  hosts: []
  tls: []

# Istio Gateway
gateway:
  enabled: false
  name: epiplexai-gateway

# Microservices configuration
services:
 
  cvservice:
    image: epiplexai.azurecr.io/cvservice:2.0
    port: 5006
    exposeExternally: false
    nodeSelector:
      "agentpool": "nodepool1"

